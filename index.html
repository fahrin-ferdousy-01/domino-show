async function validate(runs) {
  if (validating) return;
  validating = true;
  const reports = [];
  const t0 = performance.now();
  for (let r = 0; r < runs; r++) {
    const c = LAYOUT.build(CONFIG, CONFIG.layout.seed + r);
    const gen = VALIDATOR.run(RAPIER, CONFIG, c);
    let res;
    for (;;) {
      const slice = performance.now();
      do { res = gen.next(); } while (!res.done && performance.now() - slice < 14);
      if (res.done) break;
      validation = { progress: `run ${r + 1}/${runs}` };
      await new Promise((ok) => setTimeout(ok, 0));
    }
    reports.push(res.value);
  }
  const sum = VALIDATOR.summarize(course, reports);
  sum.ms = performance.now() - t0;
  validation = sum;
  RENDER.mark(sum.stalls.map((s) => s.index));
  console.log('[stall checker]', sum);
  for (const s of sum.stalls) console.log(`  standing: ${s.label} (index ${s.index}) in ${s.count}/${sum.runs} runs`);
  validating = false;
  return sum;
}

// Per-section facts the camera needs: bounds, and how tall the section
// stands (the low shot scales with it). Plus a lookup from domino to section.
function describe(c) {
  const D = CONFIG.domino;
  c.sectionOf = [];
  for (const sec of c.sections) {
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, top = D.h;
    sec.s0 = Infinity; sec.s1 = -Infinity;
    for (let i = sec.first; i < sec.first + sec.count; i++) {
      const d = c.dominoes[i];
      x0 = Math.min(x0, d.x); x1 = Math.max(x1, d.x); z0 = Math.min(z0, d.z); z1 = Math.max(z1, d.z);
      sec.s0 = Math.min(sec.s0, d.s); sec.s1 = Math.max(sec.s1, d.s);
      top = Math.max(top, d.y + (d.lay === 'stand' ? D.h : D.t) * d.scale);
      c.sectionOf[i] = sec;
    }
    sec.ext = { x0, x1, z0, z1 };
    const d0 = c.dominoes[sec.first], rx = Math.cos(d0.heading), rz = -Math.sin(d0.heading);
    sec.halfWidth = 0;
    for (let i = sec.first; i < sec.first + sec.count; i++) {
      const d = c.dominoes[i];
      sec.halfWidth = Math.max(sec.halfWidth, Math.abs((d.x - d0.cx) * rx + (d.z - d0.cz) * rz));
    }
    sec.bounds = { x: (x0 + x1) / 2, z: (z0 + z1) / 2, r: Math.max(0.12, Math.hypot(x1 - x0, z1 - z0) / 2 + 0.04), h: d0.heading };
    sec.size = Math.max(1, top / 0.06);
  }
  // Chapters as the build sees them: connectors go with the chapter they
  // lead into, a story section without a number with the one before.
  const chap = c.sections.map((s) => s.story?.chapter ?? null);
  for (let k = 0; k < chap.length; k++) if (chap[k] == null && c.sections[k].story) chap[k] = chap[k - 1] ?? 1;
  for (let k = chap.length - 1; k >= 0; k--) if (chap[k] == null) chap[k] = chap[k + 1] ?? 9;
  c.chapters = {};
  c.sections.forEach((s, k) => {
    const b = (c.chapters[chap[k]] ??= { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity, h: s.bounds.h });
    b.x0 = Math.min(b.x0, s.ext.x0); b.x1 = Math.max(b.x1, s.ext.x1); b.z0 = Math.min(b.z0, s.ext.z0); b.z1 = Math.max(b.z1, s.ext.z1);
  });
  for (const b of Object.values(c.chapters)) Object.assign(b, { x: (b.x0 + b.x1) / 2, z: (b.z0 + b.z1) / 2, r: Math.max(0.2, Math.hypot(b.x1 - b.x0, b.z1 - b.z0) / 2 + 0.05) });
  const E = c.sections.map((s) => s.ext);
  const x0 = Math.min(...E.map((e) => e.x0)), x1 = Math.max(...E.map((e) => e.x1));
  const z0 = Math.min(...E.map((e) => e.z0)), z1 = Math.max(...E.map((e) => e.z1));
  c.bounds = { x: (x0 + x1) / 2, z: (z0 + z1) / 2, r: Math.hypot(x1 - x0, z1 - z0) / 2 + 0.1 };
}

// Load the show or one piece. In the lab, frame the whole thing.
function loadCourse(name) {
  courseName = TESTS[name] ? name : 'show';
  CONFIG.sections = structuredClone(courseName === 'show' ? SHOW : TESTS[courseName]);
  validation = null;
  RENDER.clearMarks?.();
  restart(false);
  if (debug) frameAll();
}
function frameAll() {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const d of course.dominoes) { x0 = Math.min(x0, d.x); x1 = Math.max(x1, d.x); z0 = Math.min(z0, d.z); z1 = Math.max(z1, d.z); }
  const r = Math.max(0.15, Math.hypot(x1 - x0, z1 - z0) / 2);
  controls.target.set((x0 + x1) / 2, 0.01, (z0 + z1) / 2);
  RENDER.camera.position.set(controls.target.x + r * 0.9, r * 1.1, controls.target.z + r * 1.2);
  controls.update();
}

DIRECTOR.onRest = () => {
  liveReport = VALIDATOR.analyse(CONFIG, course, sim);
  if (debug && liveReport.standing.length) RENDER.mark(liveReport.standing);
};

function setDebug(on) {
  debug = on;
  document.body.classList.toggle('debug', on);
  on ? gui.show() : gui.hide();
  controls.enabled = on;
  if (on) DIRECTOR.skipBuild();
  if (on) {
    controls.target.copy(DIRECTOR.look);
    controls.update();
    overlay.classList.add('gone');
  } else {
    DIRECTOR.takeOver();
  }
}

// Fixed 240 Hz physics under a variable render rate.
let acc = 0, showT = 0, shownTenth = -1;
const timerEl = $('timer');
// The review timer is for working on the show: off on the public page (T shows it).
if (location.hostname.endsWith('github.io') && !params.has('timer')) timerEl.classList.add('off');
function tick(dt) {
  // Never negative: the first frame after a long load can carry a timestamp
  // from before the script finished, which once left the accumulator
  // seconds in debt and froze the physics through the hush and the push.
  dt = clamp(dt, 0, 0.1);
  const scale = paused ? 0 : DIRECTOR.timeScale * tune.timeScale;
  acc += dt * scale;
  let steps = 0, stepMs = 0;
  const firstStep = sim.steps + 1, t0 = performance.now();
  // Physics gets a frame budget. One moment in the show needs more: as the
  // field settles, 1,300 dominoes lie in contact and a step costs ~8 ms,
  // nearly all of it inside Rapier's solver. Rather than drop to 25 fps
  // there, time stretches until the field is still (it reads as the slow
  // motion lingering). Validation steps the sim directly, so it is unaffected.
  while (acc >= P.dt && steps < P.maxSubsteps) {
    if (steps && performance.now() - t0 + stepMs > P.frameBudget) { acc = Math.min(acc, P.dt); break; }
    const s0 = performance.now();
    sim.step();
    stepMs = performance.now() - s0;
    acc -= P.dt; steps++;
  }
  if (steps === P.maxSubsteps) acc = Math.min(acc, P.dt);  // drop time, never spiral
  if (steps) RENDER.syncActive(sim);
  DIRECTOR.update(paused ? 0 : dt, dt * scale);
  if (debug) { controls.update(); RENDER.fogFor(RENDER.camera.position.distanceTo(controls.target)); }
  RENDER.updateWire(sim);
  RENDER.updateFinger(sim);
  RENDER.render();
  AUDIO.frame(paused ? 0 : dt, steps, firstStep);
  // The review timer: show time since the click, the same clock the film
  // and the camera reports use.
  showT = DIRECTOR.state === 'READY' ? 0 : showT + (paused ? 0 : dt);
  const tenth = Math.floor(showT * 10);
  if (tenth !== shownTenth) {
    shownTenth = tenth;
    timerEl.textContent = `${Math.floor(tenth / 600)}:${String(Math.floor(tenth / 10) % 60).padStart(2, '0')}.${tenth % 10}`;
  }
}

const overlay = $('overlay');
function begin() {
  AUDIO.start();
  if (overlay.classList.contains('gone')) return;
  overlay.classList.add('gone');
  DIRECTOR.start();
}
overlay.addEventListener('click', () => { if (overlay.classList.contains('ready')) begin(); });

window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toLowerCase();
  AUDIO.start();
  if (k === 'm') AUDIO.mute();
  else if (k === 't') $('timer').classList.toggle('off');
  else if (k === 'd') setDebug(!debug);
  else if (k === 'r') { overlay.classList.add('gone'); restart(!debug); }
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'p') { overlay.classList.add('gone'); DIRECTOR.pushNow(); }
  else if (debug && k >= '1' && k <= '9') {
    if (courseName === 'show') { overlay.classList.add('gone'); restart(false); DIRECTOR.jumpTo(+k); }
    else loadCourse(PIECES[+k - 1]);
  }
  else if (debug && k === '0') loadCourse('show');
  else if (debug && courseName === 'show' && ['-', '=', ']'].includes(k)) {
    overlay.classList.add('gone'); restart(false); DIRECTOR.jumpTo({ '-': 10, '=': 11, ']': 12 }[k]);
  }
});

CONFIG.sections = structuredClone(courseName === 'show' ? SHOW : TESTS[courseName]);
restart(false);
setDebug(debug);
RENDER.updateFinger(sim);   // park it
if (debug) frameAll();
$('cta').textContent = 'Click to begin';
const BOOT_MS = { rapier: Math.round(RAPIER_MS), total: Math.round(performance.now() - BOOT) };
overlay.classList.add('ready');

let last = performance.now(), hudAt = 0, cap = null;
function frame(now) {
  if (cap) { requestAnimationFrame(frame); return; }   // a capture drives time itself
  const dt = (now - last) / 1000;
  last = now;
  if (dt > 0) fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  const t0 = performance.now();
  tick(dt);
  RENDER.adaptResolution(dt * 1000, performance.now() - t0, now);
  if (debug && now - hudAt > 200) { hudAt = now; hudText(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Hooks for scripted verification: advance the show deterministically.
window.__app = {
  RAPIER, THREE, CONFIG, LAYOUT, PHYSICS, VALIDATOR, RENDER, DIRECTOR, BUILDER, BUILD, FINGER, AUDIO, controls,
  get course() { return course; },
  get sim() { return sim; },
  advance(seconds, fps = 60) {
    const n = Math.round(seconds * fps);
    for (let i = 0; i < n; i++) tick(1 / fps);
    if (debug) hudText();
    return { t: sim.t, fallen: sim.fallen, state: DIRECTOR.state };
  },
  begin, restart, validate, setDebug, hudText, BOOT_MS, loadCourse, frameAll, TESTS,
  pause(on = !paused) { paused = on; return paused; },

  // Frame-by-frame capture for the video (tools/capture.mjs drives it).
  // Time advances exactly 1/fps per step whatever a frame costs to render,
  // physics gets no frame budget (so nothing stretches), and the overlays'
  // CSS fades are paused and set from the same clock each step, so text
  // fades in step with the picture. Sound is recorded as it plays and
  // rendered offline at the end through the same synthesis.
  capture: {
    begin({ fps = 60, tail = 17 } = {}) {
      // A fresh world: the page steps its (sleeping) course from the moment
      // it loads, a different number of times each run, and those tiny
      // differences grew into a 0.4 s drift by the Fable field. From a
      // rebuilt world every film is the same film.
      restart(false);
      cap = { fps, tail, t: 0, restAt: -1, seen: new WeakMap() };
      acc = 0;
      CONFIG.physics.frameBudget = Infinity;
      CONFIG.look.adapt.on = false;
      for (const id of ['overlay', 'keys']) $(id).style.display = 'none';
      document.body.classList.add('capture');
      overlay.classList.add('gone');
      AUDIO.record();
      DIRECTOR.start();
      return { dominoes: course.dominoes.length, size: [RENDER.renderer.domElement.width, RENDER.renderer.domElement.height] };
    },
    step() {
      tick(1 / cap.fps);
      cap.t += 1 / cap.fps;
      for (const a of document.getAnimations()) {
        if (!cap.seen.has(a)) cap.seen.set(a, cap.t);
        a.pause();
        a.currentTime = (cap.t - cap.seen.get(a)) * 1000;
      }
      if (DIRECTOR.state === 'REST' && cap.restAt < 0) cap.restAt = cap.t;
      const s = DIRECTOR.section;
      // Where the domino going over right now is on screen (-1..1).
      let wave = null;
      if (sim.lastFall >= 0 && DIRECTOR.state !== 'REST') {
        const t = sim.bodies[sim.lastFall].translation(), cam = RENDER.camera;
        const v = new THREE.Vector3(t.x, t.y, t.z).applyMatrix4(cam.matrixWorldInverse);
        const behind = v.z > 0;
        v.applyMatrix4(cam.projectionMatrix);
        wave = { x: +v.x.toFixed(3), y: +v.y.toFixed(3), behind, sec: course.sectionOf[sim.lastFall]?.id };
      }
      const cp = RENDER.camera.position;
      return {
        cam: [+cp.x.toFixed(4), +cp.y.toFixed(4), +cp.z.toFixed(4)],
        wave,
        t: cap.t, state: DIRECTOR.state, section: s?.id ?? '-', chapter: s?.story?.chapter ?? null,
        fallen: sim.fallen, done: cap.restAt >= 0 && cap.t - cap.restAt > cap.tail,
      };
    },
    // Renders the sound, then hands it over in base64 chunks of 4 MB.
    async audio() {
      const r = await AUDIO.render(0, cap.t + 0.25);
      cap.wav = r.wav;
      return { chunks: Math.ceil(r.wav.length / 0x400000), peak: r.peak, seconds: r.seconds };
    },
    audioChunk(k) {
      const part = cap.wav.subarray(k * 0x400000, (k + 1) * 0x400000);
      let s = '';
      for (let i = 0; i < part.length; i += 0x8000) s += String.fromCharCode.apply(null, part.subarray(i, i + 0x8000));
      return btoa(s);
    },
  },
};
</script>
</body>

// ================================================================ BROWSER
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const BOOT = performance.now();
await RAPIER.init();
const RAPIER_MS = performance.now() - BOOT;

let course = null, sim = null;
let debug = params.has('debug'), paused = false;

// Point on the course centre line at arc length s, extrapolated past either
// end. Forks, spirals and fields each record one centre line in LAYOUT.
function pathPoint(s) {
  const ps = course.path, n = ps.length;
  if (n < 2) { const d = course.dominoes[0]; return { x: d.cx, z: d.cz, h: d.heading }; }
  let a = ps[0], b = ps[1];
  if (s >= ps[n - 1].s) { a = ps[n - 2]; b = ps[n - 1]; }
  else if (s > ps[0].s) {
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ps[m].s <= s) lo = m; else hi = m; }
    a = ps[lo]; b = ps[hi];
  }
  const u = (s - a.s) / (b.s - a.s || 1);
  return {
    x: lerp(a.x, b.x, u), z: lerp(a.z, b.z, u),
    h: a.h + Math.atan2(Math.sin(b.h - a.h), Math.cos(b.h - a.h)) * clamp(u, 0, 1),
  };
}

// Field pictures: a two-tone mask drawn once per picture and aspect ratio
// (white = ink), then sampled as coverage over each domino's cell rather
// than at one point. Text, the Claude Code mascot, or the sign-off.
const PICTURES = new Map();
// Bold: a thin serif stroke (the top bar of a 5) is narrower than a domino
// and vanishes, and "Sonnet 5" read "Sonnet S".
const serif = (px) => `700 ${px}px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif`;
// The mascot as Claude Code draws it at startup, in block characters:
//    ▐▛███▜▌
//   ▝▜█████▛▘
//     ▘▘ ▝▝
// read as quarter-cell pixels (each twice as tall as it is wide).
const MASCOT = [
  '...############...',
  '...##.######.##...',
  '.################.',
  '...############...',
  '....#.#....#.#....',
];
function sparkRays(g, cx, cy, R) {
  const rng = makeRng(5), k = R / 47;   // the end card's twelve rays, scaled
  g.beginPath();
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + rng.signed(0.07), len = (38 + rng.signed(9)) * k, w = 5.4 * k;
    const c = Math.cos(a), s = Math.sin(a), px = (-s * w) / 2, py = (c * w) / 2;
    g.moveTo(cx + px, cy + py); g.lineTo(cx + c * len, cy + s * len); g.lineTo(cx - px, cy - py); g.closePath();
  }
  g.fill();
}
const DRAW = {
  text(g, W, H, S) {
    let px = H * 0.72;
    g.font = serif(px);
    const w = g.measureText(S.text).width;
    if (w > W * 0.9) { px *= (W * 0.9) / w; g.font = serif(px); }
    g.textBaseline = 'middle';
    g.textAlign = S.align === 'end' ? 'right' : S.align === 'start' ? 'left' : 'center';
    g.fillText(S.text, S.align === 'end' ? W * 0.985 : S.align === 'start' ? W * 0.015 : W / 2, H * 0.54);
  },
  mascot(g, W, H) {
    const cols = MASCOT[0].length, rows = MASCOT.length, aspect = cols / (rows * 2);
    const ah = Math.min(H * 0.8, (W * 0.9) / aspect), aw = ah * aspect, pw = aw / cols, ph = ah / rows;
    const x0 = (W - aw) / 2, y0 = (H - ah) / 2;
    MASCOT.forEach((line, j) => [...line].forEach((ch, i) => { if (ch === '#') g.fillRect(x0 + i * pw - 0.5, y0 + j * ph - 0.5, pw + 1, ph + 1); }));
  },
  // The spark, then the message on as many lines as S.text has ('|' breaks
  // them): a domino is 28 mm across, so one long line gets too few per letter.
  signoff(g, W, H, S) {
    const R = H * 0.4, cx = H * 0.06 + R, cy = H * 0.5;
    sparkRays(g, cx, cy, R);
    const lines = S.text.split('|'), x = cx + R + H * 0.14, room = W - x - H * 0.04;
    let px = (H * 0.86) / lines.length;
    g.font = serif(px);
    const w = Math.max(...lines.map((l) => g.measureText(l).width));
    if (w > room) { px *= room / w; g.font = serif(px); }
    g.textBaseline = 'middle'; g.textAlign = 'left';
    lines.forEach((l, i) => g.fillText(l, x, H * (0.5 + (i - (lines.length - 1) / 2) * 0.44)));
  },
};
function fieldPicture(S, x, y, geom, ink, ground) {
  const kind = S.image ?? 'text', key = `${kind}|${S.text ?? ''}|${S.align ?? ''}|${geom.aspect.toFixed(3)}`;
  let m = PICTURES.get(key);
  if (!m) {
    const W = 1200, H = Math.max(8, Math.round(W / geom.aspect));
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff';
    DRAW[kind](g, W, H, S);
    m = { W, H, data: g.getImageData(0, 0, W, H).data };
    PICTURES.set(key, m);
  }
  const { du, dv } = geom;
  const x0 = Math.max(0, Math.floor((x - du / 2) * m.W)), x1 = Math.min(m.W, Math.ceil((x + du / 2) * m.W));
  const y0 = Math.max(0, Math.floor((y - dv / 2) * m.H)), y1 = Math.min(m.H, Math.ceil((y + dv / 2) * m.H));
  let sum = 0, n = 0;
  for (let j = y0; j < y1; j += 2) for (let i = x0; i < x1; i += 2) { sum += m.data[(j * m.W + i) * 4]; n++; }
  return n > 0 && sum / n / 255 > 0.4 ? ink : ground;
}

// ---------------------------------------------------------------- RENDER
const RENDER = (() => {
  const D = CONFIG.domino;
  const canvas = $('stage');
  // With post-processing the scene is drawn into its own multisampled HDR
  // target, so the canvas needs no antialiasing of its own. ?nopost draws
  // straight to the canvas as before (and ?dpr=1.5 pins the pixel ratio).
  const wantPost = CONFIG.look && !params.has('nopost');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: !wantPost, powerPreference: 'high-performance',
    preserveDrawingBuffer: params.has('capture'),
  });
  const MAX_DPR = params.has('dpr') ? +params.get('dpr') : Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(MAX_DPR);
  const post = wantPost && ['EXT_color_buffer_float', 'EXT_color_buffer_half_float'].some((e) => renderer.extensions.has(e));

  // three's ACESFilmicToneMapping run backwards: the scene light that comes
  // out of the tone mapper (at this exposure) as colour c.
  const M3 = (...rows) => new THREE.Matrix3().set(...rows).invert();
  const ACES_IN_INV = M3(0.59719, 0.35458, 0.04823, 0.07600, 0.90834, 0.01566, 0.02840, 0.13383, 0.83777);
  const ACES_OUT_INV = M3(1.60475, -0.53108, -0.07367, -0.10208, 1.10813, -0.00605, -0.00327, -0.07276, 1.07602);
  const _tv = new THREE.Vector3();
  const unfit = (y) => {
    y = clamp(y, 0, 0.98);
    const a = 1 - 0.983729 * y, b = 0.0245786 - 0.432951 * y, c = -(0.000090537 + 0.238081 * y);
    return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
  };
  function untone(c, exposure) {
    _tv.set(c.r, c.g, c.b).applyMatrix3(ACES_OUT_INV);
    _tv.set(unfit(_tv.x), unfit(_tv.y), unfit(_tv.z)).applyMatrix3(ACES_IN_INV).multiplyScalar(0.6 / exposure);
    return c.setRGB(Math.max(0, _tv.x), Math.max(0, _tv.y), Math.max(0, _tv.z), THREE.LinearSRGBColorSpace);
  }
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const BG = 0x0b0907;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.FogExp2(BG, 0.45);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.004, 80);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const envTex = pmrem.fromScene(darkStudio(), 0.04).texture;

  // Reflections come from a dark room, not three's bright RoomEnvironment:
  // a dome that is near black below and dim above, and one soft window high
  // to one side for the lacquer's highlight. Under the bright studio, glossy
  // faces tilted towards an overhead camera mirrored its ceiling panels and
  // washed the navy field out to grey.
  function darkStudio() {
    const sc = new THREE.Scene();
    sc.add(new THREE.Mesh(
      new THREE.SphereGeometry(10, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false,
        vertexShader: 'varying vec3 vP; void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: `varying vec3 vP;
          void main() {
            float y = normalize(vP).y;
            vec3 low = vec3(0.010, 0.009, 0.008), mid = vec3(0.045, 0.040, 0.036), top = vec3(0.13, 0.13, 0.14);
            gl_FragColor = vec4(y < 0.0 ? mix(mid, low, -y) : mix(mid, top, y), 1.0);
          }`,
      }),
    ));
    const window_ = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.2, 1.9) }));
    window_.position.set(-7, 4.5, 2.5);
    window_.lookAt(0, 0, 0);
    sc.add(window_);
    return sc;
  }

  // One warm key (the sun) with a tight shadow camera that follows the wave,
  // and a sky/ground fill. Both follow a time of day: the show runs from
  // dawn through daylight to night for the reveal, and back to sunrise.
  // az: compass direction the light comes from (degrees from +z towards +x).
  const SKIES = {
    dawn:    { az: 62, el: 12, key: 0xff9a55, keyI: 3.3, sky: 0x6f84b8, ground: 0x241a12, fillI: 0.5, bg: 0x0e1019, env: 1.1, exp: 1.1 },
    day:     { az: 35, el: 52, key: 0xffe2c2, keyI: 2.3, sky: 0xa9bad6, ground: 0x3a2818, fillI: 0.9, bg: 0x0b0907, env: 1.3, exp: 1.0 },
    golden:  { az: -25, el: 22, key: 0xffbf78, keyI: 2.7, sky: 0x98a4c4, ground: 0x3a2616, fillI: 0.72, bg: 0x0d0a08, env: 1.2, exp: 1.03 },
    dusk:    { az: -70, el: 12, key: 0xff9460, keyI: 1.7, sky: 0x55679c, ground: 0x1b1512, fillI: 0.72, bg: 0x0a0c14, env: 1.0, exp: 1.06 },
    // Night's moon sits at -100 so the swing to sunrise (70) passes north,
    // the side the fields fell towards. Swinging through the south it would
    // cross the one bearing where their tilted lacquer mirrors a low sun into
    // the camera, and the names wash out in glare.
    night:   { az: -100, el: 60, key: 0xa4bcff, keyI: 1.25, sky: 0x4b66aa, ground: 0x0b111e, fillI: 0.9, bg: 0x070a12, env: 0.8, exp: 1.14 },
    // The build happens overnight under a warm work lamp.
    lamp:    { az: 25, el: 66, key: 0xffc58c, keyI: 2.5, sky: 0x39435f, ground: 0x1a120c, fillI: 0.42, bg: 0x08090d, env: 0.9, exp: 1.08 },
    sunrise: { az: 70, el: 24, key: 0xffb070, keyI: 3.0, sky: 0x8094c6, ground: 0x2c1f16, fillI: 0.85, bg: 0x0e0e14, env: 1.1, exp: 1.12 },
  };
  const mats = {};
  const KEY_DIR = new THREE.Vector3();
  const key = new THREE.DirectionalLight(0xffdcb6, 2.3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 2.5;
  key.shadow.bias = -0.0002;
  key.shadow.normalBias = 0.0004;
  Object.assign(key.shadow.camera, { near: 0.1, far: 8 });
  scene.add(key, key.target);
  const fill = new THREE.HemisphereLight(0xa9bad6, 0x3a2818, 0.9);
  scene.add(fill);

  // Current sky, eased towards a target so changes take a few seconds.
  const sky = { ...SKIES.day }, skyTo = { ...SKIES.day };
  const _ca = new THREE.Color(), _cb = new THREE.Color();
  const mixHex = (a, b, t) => _ca.set(a).lerp(_cb.set(b), t).getHex();
  function setSky(name, now = false) {
    Object.assign(skyTo, SKIES[name] ?? SKIES.day);
    if (now) Object.assign(sky, skyTo);
    applySky();
  }
  function stepSky(dt) {
    const k = 1 - Math.exp(-dt / 1.4);
    for (const n of ['el', 'keyI', 'fillI', 'env', 'exp']) sky[n] = lerp(sky[n], skyTo[n], k);
    sky.az += Math.atan2(Math.sin((skyTo.az - sky.az) * DEG), Math.cos((skyTo.az - sky.az) * DEG)) / DEG * k;
    for (const n of ['key', 'sky', 'ground', 'bg']) sky[n] = mixHex(sky[n], skyTo[n], k);
    applySky();
  }
  // Light-space basis, so the shadow camera can be snapped to whole texels
  // as it follows the wave. Without it the shadow edges crawl.
  const LX = new THREE.Vector3(), LY = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
  function applySky() {
    const az = sky.az * DEG, el = sky.el * DEG;
    KEY_DIR.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    LX.crossVectors(UP, KEY_DIR).normalize();
    LY.crossVectors(KEY_DIR, LX);
    key.color.set(sky.key); key.intensity = sky.keyI;
    fill.color.set(sky.sky); fill.groundColor.set(sky.ground); fill.intensity = sky.fillI;
    renderer.toneMappingExposure = sky.exp;
    // Skies are authored as the colour on screen. Drawn straight to the
    // canvas, the clear colour and fog skip tone mapping. Through the post
    // stack they are tone mapped with everything else, and ACES would crush
    // these near-blacks to pure black, so hand it the scene light that comes
    // out as the authored colour.
    if (post) untone(scene.background.set(sky.bg), sky.exp);
    else scene.background.set(sky.bg);
    scene.fog.color.copy(scene.background);
    if (mats.domino) mats.domino.envMapIntensity = sky.env;
  }

  let shadowHalf = 0.35;
  const _sp = new THREE.Vector3(), lastCenter = new THREE.Vector3();
  function setShadowFrame(center, half) {
    lastCenter.copy(center);
    if (Math.abs(half - shadowHalf) > 1e-4) {
      shadowHalf = half;
      Object.assign(key.shadow.camera, { left: -half, right: half, top: half, bottom: -half });
      key.shadow.camera.updateProjectionMatrix();
    }
    const texel = (2 * shadowHalf) / key.shadow.mapSize.x;
    const a = Math.round(center.dot(LX) / texel) * texel;
    const b = Math.round(center.dot(LY) / texel) * texel;
    const c = center.dot(KEY_DIR);
    _sp.copy(LX).multiplyScalar(a).addScaledVector(LY, b).addScaledVector(KEY_DIR, c);
    key.target.position.copy(_sp);
    key.position.copy(_sp).addScaledVector(KEY_DIR, 3.5);
  }

  setSky('day', true);
  setShadowFrame(new THREE.Vector3(), 0.36);

  // Tabletop: procedural oak planks under a pool of light that sinks to
  // black past the course, like a lamp over a table in a dark room.
  const TILE = 1.2;   // metres per texture tile
  const TABLE = 60;   // metres; far past the light pool so no edge ever shows
  const pool = { value: new THREE.Vector4(0, 0.7, 1.2, 1.6) };   // centre x, z, radius, falloff
  const tableMat = new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.58, metalness: 0 });
  tableMat.onBeforeCompile = (sh) => {
    sh.uniforms.uPool = pool;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vTableXZ;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvTableXZ = (modelMatrix * vec4(transformed, 1.0)).xz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec4 uPool;\nvarying vec2 vTableXZ;')
      .replace('#include <opaque_fragment>', `
        float poolD = length(vTableXZ - uPool.xy);
        outgoingLight *= mix(0.015, 1.0, 1.0 - smoothstep(uPool.z, uPool.z + uPool.w, poolD));
        #include <opaque_fragment>`);
  };
  const table = new THREE.Mesh(new THREE.PlaneGeometry(TABLE, TABLE), tableMat);
  table.rotation.x = -Math.PI / 2;
  table.receiveShadow = true;
  scene.add(table);

  // Flat-sawn oak: fine late-wood lines a few millimetres apart that drift
  // gently along each plank, low contrast, a little tone change per board.
  function woodTexture() {
    const W = 2048, H = 2048, planks = 8, pw = W / planks;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(W, H), px = img.data;
    const rng = makeRng(11);
    const N = 4096, tab = Float32Array.from({ length: N }, () => rng());
    const vn = (x) => {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      return tab[i & (N - 1)] * (1 - u) + tab[(i + 1) & (N - 1)] * u;
    };
    const P = Array.from({ length: planks }, () => ({
      tone: 0.9 + rng() * 0.16, hue: rng() * 0.06, phase: rng() * 900,
      period: 5 + rng() * 4, joint: rng() * H,
    }));
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const k = Math.floor(x / pw), p = P[k], lx = x - k * pw;
        // lateral drift of the grain along the board, plus an uneven ring width
        const drift = (vn(y * 0.0025 + p.phase) - 0.5) * 22 + (vn(y * 0.02 + p.phase * 2) - 0.5) * 2.5;
        let u = lx + drift + (vn(lx * 0.03 + p.phase) - 0.5) * 14;
        u += (vn(u * 0.11 + p.phase * 4) - 0.5) * 10;   // uneven ring spacing, not corduroy
        const ring = Math.pow(0.5 + 0.5 * Math.cos((u / p.period) * 2 * Math.PI), 3) * (0.5 + vn(u * 0.07 + p.phase));
        const pores = vn(lx * 2.3 + p.phase * 7 + vn(y * 0.004 + p.phase) * 6) * vn(y * 0.4 + lx * 5.1);
        const board = 1 + (vn(y * 0.0012 + p.phase * 3) - 0.5) * 0.1;
        let v = p.tone * board * (1 - 0.1 * ring - 0.07 * pores);
        if (lx < 1.4 || Math.abs(y - p.joint) < 1.1) v *= 0.5;
        const o = (y * W + x) * 4;
        px[o] = 168 * v; px[o + 1] = (132 - p.hue * 50) * v; px[o + 2] = (100 - p.hue * 70) * v; px[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(TABLE / TILE, TABLE / TILE);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  function fitPool(c) {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const d of c.dominoes) {
      minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x);
      minZ = Math.min(minZ, d.z); maxZ = Math.max(maxZ, d.z);
    }
    const r = Math.hypot(maxX - minX, maxZ - minZ) / 2;
    pool.value.set((minX + maxX) / 2, (minZ + maxZ) / 2, r + 0.3, Math.min(2.4, 0.8 + r * 0.4));
  }

  // Dominoes: one InstancedMesh, lacquered, per-instance tint. Two segments
  // round each 0.8 mm bevel (300 triangles). Vertex work is most of the GPU
  // bill with 2,692 instances drawn twice (camera and shadow): three
  // segments cost 2.0 ms a frame on an M1 Max, two cost 1.3, and the
  // highlight along the edge still reads as round.
  const dominoGeo = new RoundedBoxGeometry(D.w, D.h, D.t, 2, D.bevel);
  const dominoMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.36, clearcoat: 1, clearcoatRoughness: 0.18,
    envMap: envTex, envMapIntensity: 0.8,
  });
  mats.domino = dominoMat;
  dominoMat.envMapIntensity = sky.env;
  // Each domino can carry a second colour on its back face (the face that
  // ends up on top once it has fallen forward). The field's picture lives
  // there. It only shows once the domino has tipped (from about 40 degrees,
  // fully by 70), so a standing field reads as plain from any angle, as the
  // brief asks, and the picture appears exactly as the wave passes.
  dominoMat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 aBack;\nvarying vec3 vBackColor;\nvarying float vBack;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vBackColor = aBack;
        float upY = normalize(instanceMatrix[1].xyz).y;
        vBack = step(normal.z, -0.5) * (1.0 - smoothstep(0.34, 0.77, upY));`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vBackColor;\nvarying float vBack;')
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, vBackColor, vBack);');
  };
  // The dominoes are drawn in chunks of table CHUNK metres square, each its
  // own InstancedMesh with bounds wide enough for its dominoes to fall about
  // in, so three skips every chunk outside the shot and outside the shadow
  // camera's small box. Drawing all 19,000 twice a frame was most of the GPU
  // bill (11 ms a frame in the preview pane, against 3.7 ms for 2,000 of
  // them). A chunk only re-uploads its matrices when something in it moved.
  const CHUNK = 0.8;
  let chunks = [], where = [], cur = null;   // where[i] = [chunk, index in it]
  const base = [];
  const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _c = new THREE.Color();

  function setCourse(c) {
    cur = c;
    fitPool(c);
    for (const k of chunks) { scene.remove(k.mesh); k.mesh.geometry.dispose(); k.mesh.dispose(); }
    const cells = new Map();
    for (const d of c.dominoes) {
      const key = `${Math.floor(d.x / CHUNK)},${Math.floor(d.z / CHUNK)}`;
      (cells.get(key) ?? cells.set(key, []).get(key)).push(d.index);
    }
    chunks = []; where = new Array(c.dominoes.length); base.length = c.dominoes.length;
    for (const ids of cells.values()) {
      const n = ids.length, geo = new THREE.BufferGeometry();
      geo.setIndex(dominoGeo.index);
      for (const [name, attr] of Object.entries(dominoGeo.attributes)) if (name !== 'aBack') geo.setAttribute(name, attr);
      const mesh = new THREE.InstancedMesh(geo, dominoMat, n), backs = new Float32Array(n * 3);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.castShadow = mesh.receiveShadow = true;
      let cx = 0, cz = 0;
      for (const i of ids) { cx += c.dominoes[i].x; cz += c.dominoes[i].z; }
      cx /= n; cz /= n;
      let r = 0;
      ids.forEach((i, k) => {
        const d = c.dominoes[i], col = new THREE.Color(d.color).multiplyScalar(d.tint);
        r = Math.max(r, Math.hypot(d.x - cx, d.z - cz) + D.h * d.scale * 1.3 + 0.05);
        where[i] = [chunks.length, k];
        base[i] = col;
        mesh.setColorAt(k, col);
        (d.back === null ? col : _c.set(d.back).multiplyScalar(d.tint)).toArray(backs, k * 3);
      });
      geo.setAttribute('aBack', new THREE.InstancedBufferAttribute(backs, 3));
      mesh.boundingSphere = new THREE.Sphere(new THREE.Vector3(cx, 0.05, cz), r);
      mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);
      chunks.push({ mesh, dirty: true });
    }
  }

  function put(i, m) { const [k, j] = where[i], ch = chunks[k]; ch.mesh.setMatrixAt(j, m); ch.dirty = true; }
  function commit() { for (const ch of chunks) if (ch.dirty) { ch.mesh.instanceMatrix.needsUpdate = true; ch.dirty = false; } }
  function writeBody(i, b) {
    const t = b.translation(), r = b.rotation();
    _p.set(t.x, t.y, t.z); _q.set(r.x, r.y, r.z, r.w); _s.setScalar(cur.dominoes[i].scale);
    put(i, _m.compose(_p, _q, _s));
  }
  function syncAll(s) { s.bodies.forEach((b, i) => writeBody(i, b)); commit(); }
  function syncActive(s) {
    s.world.forEachActiveRigidBody((b) => { if (b.userData !== undefined) writeBody(b.userData, b); });
    commit();
  }
  // The build draws instances itself: hidden (zero scale) until placed.
  const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
  function setPose(i, p, q, scale) { _s.setScalar(scale); put(i, _m.compose(p, q, _s)); }
  function hideAll() { for (let i = 0; i < where.length; i++) put(i, ZERO); commit(); }

  // The finger: a soft skin capsule, longer than its collider so the hand
  // it belongs to is always out of frame. Its tip follows the sim's fingertip.
  const FINGER_LEN = 0.13;
  const finger = new THREE.Mesh(
    new THREE.CapsuleGeometry(FINGER.R, FINGER_LEN, 10, 24),
    new THREE.MeshPhysicalMaterial({
      color: 0xe3b8a8, roughness: 0.6, sheen: 0.7, sheenRoughness: 0.5, sheenColor: 0xffe0d4,
      clearcoat: 0.12, clearcoatRoughness: 0.5,
    }),
  );
  finger.castShadow = true;
  scene.add(finger);
  // A pale nail on top of the tip, so the shape reads as a finger at a glance.
  const nail = new THREE.Mesh(
    new RoundedBoxGeometry(0.0115, 0.0016, 0.0125, 2, 0.0007),
    new THREE.MeshPhysicalMaterial({ color: 0xf0cbbd, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2 }),
  );
  scene.add(nail);
  // Off duty the finger is parked under the tabletop but still drawn every
  // frame. Hiding it instead left the GPU to build its pipeline on first
  // appearance, a 200-300 ms stall at the push that neither
  // renderer.compile() nor a warm-up frame prevented.
  for (const m of [finger, nail]) m.frustumCulled = false;
  const PARK = -1;
  const _fy = new THREE.Vector3(0, 1, 0), _fa = new THREE.Vector3(), _fu = new THREE.Vector3(), _fr = new THREE.Vector3(), _fm = new THREE.Matrix4();
  function updateFinger(s) {
    const fg = s.finger;
    if (!fg) { finger.position.set(0, PARK, 0); nail.position.set(0, PARK, 0); return; }
    _fa.set(...fg.axis);
    finger.quaternion.setFromUnitVectors(_fy, _fa);
    finger.position.set(fg.tip.x, fg.tip.y, fg.tip.z).addScaledVector(_fa, -FINGER_LEN / 2);
    // nail frame: across the finger, up out of its top, along it
    _fu.set(0, 1, 0).addScaledVector(_fa, -_fa.y).normalize();
    _fr.crossVectors(_fu, _fa).normalize();
    nail.quaternion.setFromRotationMatrix(_fm.makeBasis(_fr, _fu, _fa));
    nail.position.set(fg.tip.x, fg.tip.y, fg.tip.z).addScaledVector(_fu, FINGER.R - 0.0005).addScaledVector(_fa, -0.0055);
  }
  function colour(i, c) { const [k, j] = where[i]; chunks[k].mesh.setColorAt(j, c); }
  function mark(indices, hex = 0xff3b24) {
    clearMarks();
    for (const i of indices) colour(i, _c.setHex(hex));
    for (const ch of chunks) ch.mesh.instanceColor.needsUpdate = true;
  }
  function clearMarks() {
    base.forEach((c, i) => colour(i, c));
    for (const ch of chunks) ch.mesh.instanceColor.needsUpdate = true;
  }

  // Physics wireframes straight from Rapier's debug renderer.
  const wireGeo = new THREE.BufferGeometry();
  const wire = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.85, depthTest: false, fog: false,
  }));
  wire.renderOrder = 10;
  wire.frustumCulled = false;
  wire.visible = false;
  scene.add(wire);
  function updateWire(s) {
    if (!wire.visible) return;
    const { vertices, colors } = s.world.debugRender();
    wireGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    wireGeo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
  }

  // ---- The post stack: scene -> depth of field -> bloom -> print.
  // The scene renders once, into a 4x multisampled half-float target with a
  // depth texture, so depth of field needs no second depth-only render of
  // 2,692 dominoes (three's BokehPass draws the scene twice). Depth of field
  // gathers at reduced resolution (at most 720 px tall) and blends back in by
  // each pixel's blur, bloom picks up only what is brighter than the lacquer
  // in full sun, and the last pass tone maps (ACES, as before), converts to
  // sRGB and adds the vignette and grain.
  const LOOK = CONFIG.look;
  const lens = { focus: 0.3, aperture: 0.01 };   // set by the director each frame
  const FSQ_VERT = `precision highp float;
    uniform mat4 modelViewMatrix, projectionMatrix;
    attribute vec3 position; attribute vec2 uv;
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const quad = (uniforms, frag, defines = {}) => new FullScreenQuad(new THREE.RawShaderMaterial({
    uniforms, defines, vertexShader: FSQ_VERT, fragmentShader: `precision highp float;\nvarying vec2 vUv;\n#define HOT vec3(${LOOK.hot.toFixed(1)})\n${frag}`,
    depthTest: false, depthWrite: false,
  }));
  // Signed blur radius in full-resolution pixels: negative in front of the
  // focus plane, positive behind it.
  const COC_GLSL = `
    uniform sampler2D tDepth;
    uniform float uNear, uFar, uFocus, uCocK, uMaxCoc;
    float coc(vec2 uv) {
      float d = texture2D(tDepth, uv).x;
      float z = uNear * uFar / (uFar - d * (uFar - uNear));
      return clamp(uCocK * (1.0 - uFocus / z), -uMaxCoc, uMaxCoc);
    }`;

  class ScenePass extends Pass {
    constructor() {
      super();
      this.needsSwap = false;
      this.target = new THREE.WebGLRenderTarget(1, 1, {
        type: THREE.HalfFloatType, samples: 4, depthTexture: new THREE.DepthTexture(1, 1),
      });
    }
    setSize(w, h) { this.target.setSize(w, h); }
    render(r) { r.setRenderTarget(this.target); r.render(scene, camera); }
  }

  class DofPass extends Pass {
    constructor(src) {
      super();
      this.src = src;
      const rt = () => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
      this.cocRT = rt(); this.blurRT = rt();
      const lensU = () => ({
        tDepth: { value: src.depthTexture }, uNear: { value: camera.near }, uFar: { value: camera.far },
        uFocus: { value: 1 }, uCocK: { value: 0 }, uMaxCoc: { value: 1 },
      });
      // 1. Downsample through four bilinear taps (a 2.5-pixel footprint
      // at 0.4 scale aliases a thin highlight into a row of dots with one
      // tap), and store the blur (in low-res pixels) of the nearest of the
      // four depths under it, so blurred foreground edges win.
      this.cocQ = quad({ ...lensU(), tColor: { value: src.texture }, uTexel: { value: new THREE.Vector2() }, uScale: { value: 0.5 } }, `
        uniform sampler2D tColor; uniform vec2 uTexel; uniform float uScale;
        ${COC_GLSL}
        void main() {
          vec2 o = uTexel * 0.75;
          vec2 p0 = vUv + vec2(-o.x, -o.y), p1 = vUv + vec2(o.x, -o.y), p2 = vUv + vec2(-o.x, o.y), p3 = vUv + o;
          vec3 col = 0.25 * (min(texture2D(tColor, p0).rgb, HOT) + min(texture2D(tColor, p1).rgb, HOT) + min(texture2D(tColor, p2).rgb, HOT) + min(texture2D(tColor, p3).rgb, HOT));
          gl_FragColor = vec4(col, min(min(coc(p0), coc(p1)), min(coc(p2), coc(p3))) * uScale);
        }`);
      // 2. Gather over a golden-angle disk. A sample only counts if its own
      // blur reaches this pixel, and something behind this pixel may blur
      // over it by no more than twice this pixel's own blur, so sharp
      // edges never smear onto the background behind them (Gustafsson's
      // scatter-as-gather). Alpha carries how far blurred foreground
      // spills over this pixel.
      this.gatherQ = quad({ tCoc: { value: this.cocRT.texture }, uTexel: { value: new THREE.Vector2() }, uMaxR: { value: 8 } }, `
        uniform sampler2D tCoc; uniform vec2 uTexel; uniform float uMaxR;
        void main() {
          vec4 c = texture2D(tCoc, vUv);
          float cr = abs(c.a), wsum = 1.0, spill = cr;
          vec3 acc = c.rgb;
          for (int i = 1; i < TAPS; i++) {
            float fi = float(i), r = sqrt(fi / float(TAPS)) * uMaxR, th = fi * 2.39996323;
            vec4 s = texture2D(tCoc, vUv + vec2(cos(th), sin(th)) * r * uTexel);
            float sr = abs(s.a);
            if (s.a > c.a) sr = min(sr, cr * 2.0);
            float w = smoothstep(r - 0.75, r + 0.75, sr);
            acc += s.rgb * w; wsum += w;
            if (s.a < c.a) spill = max(spill, sr * w);
          }
          gl_FragColor = vec4(acc / wsum, spill);
        }`, { TAPS: 64 });
      // 3. Full resolution: sharp where in focus, the gathered blur where
      // not, by this pixel's blur or whatever foreground spills over it.
      // Upsampling is depth aware: of the nine low-res pixels around this
      // one, each counts by a tent weight times how close its blur is to
      // this pixel's own. Background pixels hugging a sharp edge then
      // take their blur from background neighbours only; a plain bilinear
      // read pulls in the low-res pixels that straddle the edge and leaves
      // a row of dots along it.
      this.mixQ = quad({
        ...lensU(), tColor: { value: src.texture }, tBlur: { value: this.blurRT.texture }, tCoc: { value: this.cocRT.texture },
        uScale: { value: 0.5 }, uLowSize: { value: new THREE.Vector2(1, 1) },
      }, `
        uniform sampler2D tColor, tBlur, tCoc; uniform float uScale; uniform vec2 uLowSize;
        ${COC_GLSL}
        void main() {
          vec3 sharp = min(texture2D(tColor, vUv).rgb, HOT);
          float own = coc(vUv);
          vec2 pos = vUv * uLowSize - 0.5, cell = floor(pos + 0.5), px = 1.0 / uLowSize;
          vec4 acc = vec4(0.0); float wsum = 0.0;
          for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
            vec2 texel = cell + vec2(float(i), float(j)), uv = (texel + 0.5) * px;
            float bw = max(0.0, 1.0 - length(texel - pos) / 1.6);
            float d = texture2D(tCoc, uv).a - own * uScale;
            float w = bw / (1.0 + d * d) + 1e-6;
            acc += texture2D(tBlur, uv) * w; wsum += w;
          }
          vec4 b = acc / wsum;
          float t = smoothstep(0.6, 2.2, max(abs(own), b.a / uScale));
          gl_FragColor = vec4(mix(sharp, b.rgb, t), 1.0);
        }`);
      this.copyQ = quad({ tColor: { value: src.texture } }, `
        uniform sampler2D tColor;
        void main() { gl_FragColor = vec4(min(texture2D(tColor, vUv).rgb, HOT), 1.0); }`);
    }
    setSize(w, h) {
      this.w = w; this.h = h;
      this.scale = Math.min(0.5, 720 / h);
      const lw = Math.max(1, Math.round(w * this.scale)), lh = Math.max(1, Math.round(h * this.scale));
      this.cocRT.setSize(lw, lh); this.blurRT.setSize(lw, lh);
      this.cocQ.material.uniforms.uTexel.value.set(1 / w, 1 / h);
      this.gatherQ.material.uniforms.uTexel.value.set(1 / lw, 1 / lh);
      this.mixQ.material.uniforms.uLowSize.value.set(lw, lh);
    }
    render(r, write) {
      const out = this.renderToScreen ? null : write;
      const A = LOOK.dof.on ? lens.aperture : 0;
      if (A * this.h < 0.3) { r.setRenderTarget(out); this.copyQ.render(r); return; }
      const maxCoc = Math.min(LOOK.dof.maxCoc, A * 1.5) * this.h;
      for (const q of [this.cocQ, this.mixQ]) {
        const u = q.material.uniforms;
        u.uFocus.value = lens.focus; u.uCocK.value = A * this.h; u.uMaxCoc.value = maxCoc;
        u.uNear.value = camera.near; u.uFar.value = camera.far; u.uScale.value = this.scale;
      }
      this.gatherQ.material.uniforms.uMaxR.value = Math.max(1, maxCoc * this.scale);
      r.setRenderTarget(this.cocRT); this.cocQ.render(r);
      r.setRenderTarget(this.blurRT); this.gatherQ.render(r);
      r.setRenderTarget(out); this.mixQ.render(r);
    }
  }

  // The print: vignette in scene light (a lens darkening, before the tone
  // curve), ACES, sRGB, then grain in display space, strongest in the mid
  // tones like film and animated per frame.
  class PrintPass extends Pass {
    constructor() {
      super();
      this.q = quad({
        tDiffuse: { value: null }, toneMappingExposure: { value: 1 }, uAspect: { value: 1 },
        uVignette: { value: LOOK.vignette }, uGrain: { value: LOOK.grain }, uSeed: { value: 0 },
      }, `
        uniform sampler2D tDiffuse; uniform float uAspect, uVignette, uGrain, uSeed;
        #include <tonemapping_pars_fragment>
        #include <colorspace_pars_fragment>
        float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
        void main() {
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0);
          float fall = 1.0 / pow(1.0 + dot(q, q) * 0.9, 2.0);
          c *= mix(1.0, fall, uVignette);
          vec4 o = sRGBTransferOETF(vec4(ACESFilmicToneMapping(c), 1.0));
          float l = dot(o.rgb, vec3(0.2126, 0.7152, 0.0722));
          vec2 p = gl_FragCoord.xy + uSeed;
          float n = hash(p) + hash(p + 17.31) - 1.0;   // triangular, -1..1
          o.rgb += n * uGrain * (0.35 + 0.65 * 4.0 * l * (1.0 - l));
          gl_FragColor = o;
        }`);
    }
    setSize(w, h) { this.q.material.uniforms.uAspect.value = w / h; }
    render(r, write, read) {
      const u = this.q.material.uniforms;
      u.tDiffuse.value = read.texture;
      u.toneMappingExposure.value = r.toneMappingExposure;
      u.uVignette.value = LOOK.vignette; u.uGrain.value = LOOK.grain;
      u.uSeed.value = (u.uSeed.value + 97.13) % 4096;
      r.setRenderTarget(this.renderToScreen ? null : write);
      this.q.render(r);
    }
  }

  let composer = null, bloom = null;
  if (post) {
    composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false }));
    const scenePass = new ScenePass();
    composer.addPass(scenePass);
    composer.addPass(new DofPass(scenePass.target));
    const B = LOOK.bloom;
    bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), B.strength, B.radius, B.threshold);
    bloom.highPassUniforms.smoothWidth.value = B.knee;
    composer.addPass(bloom);
    composer.addPass(new PrintPass());
  }

  // Resolution follows the frame rate. When frames run slower than about
  // 54 fps while the CPU side of the frame (physics, director, draw calls)
  // is light, the GPU is what is behind, and the pixel ratio steps down a
  // quarter. After a steady spell it tries a quarter back up, and waits
  // twice as long next time if that step had to be undone. GPU timer
  // queries would be the direct measure, but Chrome on Apple silicon
  // (ANGLE over Metal) reports 11 ms for frames that take under 3.
  const adapt = { frame: 16.7, cpu: 0, ratio: MAX_DPR, changedAt: 0, upAt: -1e9, wait: 6000 };
  function adaptResolution(frameMs, cpuMs, now) {
    const A = LOOK.adapt;
    if (!A.on || params.has('dpr') || document.hidden || frameMs > 100 || frameMs <= 0) return;
    adapt.frame += (frameMs - adapt.frame) * 0.05;
    adapt.cpu += (cpuMs - adapt.cpu) * 0.05;
    if (now - adapt.changedAt < 2500) return;
    const slow = adapt.frame > 18.5 && adapt.cpu < 10;
    let next = adapt.ratio;
    if (slow && adapt.ratio > A.min) {
      next = Math.max(A.min, adapt.ratio - 0.25);
      if (now - adapt.upAt < 6000) adapt.wait = Math.min(60000, adapt.wait * 2);
    } else if (adapt.frame < 17.2 && adapt.ratio < MAX_DPR && now - adapt.changedAt > adapt.wait) {
      next = Math.min(MAX_DPR, adapt.ratio + 0.25);
      adapt.upAt = now;
    }
    if (next !== adapt.ratio) { adapt.ratio = next; adapt.changedAt = now; renderer.setPixelRatio(next); resize(); }
  }

  function resize() {
    const w = window.innerWidth || canvas.clientWidth || 1280;
    const h = window.innerHeight || canvas.clientHeight || 720;
    renderer.setSize(w, h, false);
    if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  return {
    renderer, scene, camera, key, wire, SKIES,
    setCourse, syncAll, syncActive, mark, clearMarks, setShadowFrame, updateWire, resize, setSky, stepSky,
    setPose, hideAll, commit, updateFinger,
    get sky() { return sky; },
    keyDir: KEY_DIR,
    lens, bloom, composer, adapt, adaptResolution,
    render() {
      if (composer) {
        bloom.enabled = LOOK.bloom.on;
        bloom.strength = LOOK.bloom.strength; bloom.threshold = LOOK.bloom.threshold; bloom.radius = LOOK.bloom.radius;
        bloom.highPassUniforms.smoothWidth.value = LOOK.bloom.knee;
        composer.render();
      } else renderer.render(scene, camera);
    },
    // Fog is the edge vignette. Keep what the camera is looking at clear
    // whether it is 25 cm or 3 m away.
    fogFor(dist) { scene.fog.density = 0.15 / Math.max(0.33, dist); },
  };
})();

// ----------------------------------------------------------------- AUDIO
// Every sound is synthesized. Impacts come from Rapier's contact forces
// (PHYSICS opts.impacts): a noise burst through resonant band-passes, pitched
// and weighted by domino size and force, panned and attenuated by where it
// happened relative to the camera. A voice cap and a per-frame cap keep dense
// moments clean, and whatever does not get a voice feeds a noise "rain" bed,
// so the field sounds like rain instead of clipping. A low room tone runs
// under everything, dips for the hush and stops dead after the last domino.
// The synthesis works on any AudioContext, so a run can be recorded and
// rendered offline to a WAV (AUDIO.record / AUDIO.render).
const AUDIO = (() => {
  const A = CONFIG.audio, LAT = 0.05;
  let g = null, muted = false, vt = 0, rec = null, voices = [], rainE = 0, rainLevel = 0;
  let mood = null, finalAt = -1, restAt = -1, doneAt = -1;
  const heard = new Map();   // domino -> last time (sim s) and level it sounded
  const placed = [], P3 = new THREE.Vector3(), CAM = new THREE.Vector3();
  const rnd = () => Math.random() * 2 - 1;

  // How each kind of contact sounds: band-pass resonances [Hz, Q, gain],
  // how pitch and decay scale with domino size, and an optional low thump
  // for the big ones. Plastic on plastic is bright and short; on the table
  // it is lower with a woody body; a placement is a small high tick.
  const TIMBRE = {
    domino: { bands: [[3100, 7, 1], [5600, 9, 0.5], [1200, 2.5, 0.25]], fPow: 0.8, tau: 0.0055, tauPow: 0.5 },
    table:  { bands: [[1700, 3.5, 1], [430, 1.8, 0.75]], fPow: 0.75, tau: 0.011, tauPow: 0.55, thump: 110 },
    place:  { bands: [[4600, 6, 1], [1300, 2, 0.4]], fPow: 0, tau: 0.0045, tauPow: 0 },
    finger: { bands: [[520, 1.2, 1]], fPow: 0, tau: 0.03, tauPow: 0 },
  };

  function noise(c, seconds, brown) {
    const b = c.createBuffer(1, Math.floor(c.sampleRate * seconds), c.sampleRate), d = b.getChannelData(0);
    let last = 0, peak = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      d[i] = brown ? (last = (last + 0.02 * w) / 1.02) : w;
      peak = Math.max(peak, Math.abs(d[i]));
    }
    if (brown) for (let i = 0; i < d.length; i++) d[i] /= peak;
    return b;
  }

  // The fixed part of the graph: compressor and master, room tone, rain bed.
  // Compressor, master level and a brick-wall limiter last (clicks rise
  // faster than the compressor reacts). Returns what to feed.
  function dynamics(c) {
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.15;
    const master = c.createGain();
    master.gain.value = muted ? 0 : A.volume;
    const limit = c.createDynamicsCompressor();
    limit.threshold.value = -4; limit.knee.value = 0; limit.ratio.value = 20; limit.attack.value = 0.0005; limit.release.value = 0.08;
    comp.connect(master).connect(limit).connect(c.destination);
    return { comp, master };
  }

  // `mode`: 'full' is the live graph. The offline render builds the parts
  // before the compressor on their own, straight to the output: 'bed' (room
  // tone and rain) and 'voices' (just what impacts need).
  function build(c, mode = 'full') {
    const white = noise(c, 1.2, false);
    let comp, master;
    if (mode === 'full') ({ comp, master } = dynamics(c));
    else { comp = c.createGain(); comp.connect(c.destination); }
    if (mode === 'voices') return { c, comp, white };

    // Room: brown noise under 190 Hz and a faint 50 Hz mains hum.
    const room = c.createGain();
    room.gain.value = 0;
    const bed = c.createBufferSource();
    bed.buffer = noise(c, 5, true); bed.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 190;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 28;
    const bedG = c.createGain(); bedG.gain.value = 0.045;   // felt more than heard, about -37 dBFS
    bed.connect(lp).connect(hp).connect(bedG).connect(room);
    const hum = c.createOscillator(); hum.frequency.value = 50;
    const humG = c.createGain(); humG.gain.value = 0.0025;
    hum.connect(humG).connect(room);
    room.connect(comp);
    bed.start(); hum.start();

    // Rain: bright band-passed noise, level driven by impacts without a voice.
    const rain = c.createGain();
    rain.gain.value = 0;
    const rs = c.createBufferSource();
    rs.buffer = white; rs.loop = true;
    const rb = c.createBiquadFilter(); rb.type = 'bandpass'; rb.frequency.value = 2900; rb.Q.value = 0.6;
    const rh = c.createBiquadFilter(); rh.type = 'highshelf'; rh.frequency.value = 6000; rh.gain.value = -6;
    rs.connect(rb).connect(rh).connect(rain).connect(comp);
    rs.start();
    return { c, comp, master, white, room, rain };
  }

  // One voice. Slow motion lowers it and draws it out, like a slowed film.
  function voice(G, p, when) {
    const c = G.c, T = TIMBRE[p.kind], s = p.scale, slow = p.slow ?? 1;
    const pitch = (1 + rnd() * 0.1) * Math.pow(slow, 0.3), stretch = Math.pow(slow, -0.45);
    const amp = p.amp * (1 + rnd() * 0.1), tau = T.tau * Math.pow(s, T.tauPow) * stretch;
    const env = c.createGain();
    env.gain.setValueAtTime(0, when);
    env.gain.linearRampToValueAtTime(amp, when + 0.0007);
    env.gain.setTargetAtTime(0, when + 0.0007, tau);
    const pan = c.createStereoPanner();
    pan.pan.value = p.pan;
    env.connect(pan).connect(G.comp);
    const src = c.createBufferSource();
    src.buffer = G.white;
    for (const [f, q, gain] of T.bands) {
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = clamp((f * pitch) / Math.pow(s, T.fPow), 30, 16000);
      bp.Q.value = q;
      const bg = c.createGain();
      bg.gain.value = gain * 1.6 * Math.sqrt(q);   // make-up for the narrow band
      src.connect(bp).connect(bg).connect(env);
    }
    const dur = tau * 7 + 0.003;
    src.start(when, Math.random() * 0.9, dur);
    let last = src;
    if (T.thump && s >= 2.5) {
      const o = c.createOscillator(), og = c.createGain(), f0 = T.thump / Math.pow(s, 0.35) * pitch;
      o.frequency.setValueAtTime(f0, when);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.6, when + tau * 5);
      og.gain.setValueAtTime(amp * 0.9 * Math.min(1, (s - 2) / 6), when);
      og.gain.setTargetAtTime(0, when + 0.002, tau * 2.5);
      o.connect(og).connect(pan);
      o.start(when);
      o.stop(when + tau * 14);
      last = o;
    }
    // Unplug the voice the moment it is done. Left connected, finished voices
    // stay in the audio thread's graph until garbage collection gets round to
    // them: by the pacing stairs tens of thousands had piled up, the audio
    // clock fell to a sixth of real time and the sound broke up for 25 s.
    last.onended = () => { pan.disconnect(); env.disconnect(); };
    return when + dur;
  }

  // Loudness from how much harder than resting the contact pushed, the kind
  // of contact, and the size of the domino. Returns 0 for nothing to hear.
  function level(im) {
    const d = course.dominoes[im.a], s = d.scale;
    const weight = CONFIG.physics.density * CONFIG.domino.w * CONFIG.domino.h * CONFIG.domino.t * s ** 3 * 9.81;
    const r = im.f / (A.threshold * weight);
    const base = clamp(0.3 + 0.25 * Math.log2(Math.max(r, 1)), 0.12, 1.3);
    return base * (im.b === -1 ? 0.45 : im.b === -2 ? 0.5 : 1) * (0.75 + 0.25 * Math.log2(1 + s));
  }

  // Where a sound sits: panned by its place across the frame, and quieter
  // the further it is past the point the camera is looking at.
  function place3(x, y, z, cam) {
    P3.set(x, y, z);
    const dist = P3.distanceTo(cam.position), ref = Math.max(0.05, cam.userData.focus ?? 0.3);
    P3.applyMatrix4(cam.matrixWorldInverse);
    return { pan: clamp((P3.x / Math.max(0.05, -P3.z)) * 0.8, -0.85, 0.85), att: clamp(Math.pow(ref / Math.max(dist, 0.03), 0.8), 0.15, 1.6) };
  }

  function schedule(p, frac, dt) {
    const at = vt + LAT + frac * dt;
    if (rec) rec.push({ t: at, p });
    let end = at + 0.1;
    if (g) end = voice(g, p, g.c.currentTime + LAT + frac * dt) - g.c.currentTime + vt;
    voices.push(end);
  }

  function setRoom(level, tc) {
    if (rec) rec.push({ t: vt, room: level, tc });
    if (g) g.room.gain.setTargetAtTime(level, g.c.currentTime, tc);
  }

  return {
    get started() { return !!g; },
    get muted() { return muted; },
    get context() { return g?.c.state ?? 'off'; },
    get voices() { return voices.length; },

    // Needs a user gesture (the click that starts the show).
    start() {
      if (g) { g.c.resume(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      g = build(new Ctx());
      mood = null;
    },
    mute(on = !muted) {
      muted = on;
      if (g) g.master.gain.setTargetAtTime(muted ? 0 : A.volume, g.c.currentTime, 0.05);
      return muted;
    },

    // A domino set down during the build.
    place(i) { placed.push(i); },

    // Once per rendered frame, after the physics steps.
    frame(dt, steps, firstStep) {
      vt += dt;
      if (!g && !rec) { sim.impacts.length = 0; placed.length = 0; return; }
      voices = voices.filter((e) => e > vt);
      // The end: once every domino is down, the last ones get 0.3 s to land
      // and then the settling chatter dies away in half a second. (It went on
      // clattering at full level under the finished message until the camera
      // cut away, two seconds later.)
      if (doneAt < 0 && (sim.fallen >= sim.nChain || DIRECTOR.state === 'REST')) doneAt = vt;
      const hush = doneAt < 0 ? 1 : clamp(1 - (vt - doneAt - 0.3) / 0.5, 0, 1);
      const cam = RENDER.camera, slow = DIRECTOR.timeScale, list = [];
      for (const im of sim.impacts) {
        const amp0 = level(im), t0 = im.step * CONFIG.physics.dt, last = heard.get(im.a);
        if (last && t0 - last.t < A.refractory && amp0 < last.amp * 2) continue;   // chatter
        heard.set(im.a, { t: t0, amp: amp0 });
        const t = sim.bodies[im.a].translation(), where = place3(t.x, t.y, t.z, cam);
        list.push({ amp: amp0 * where.att * hush, pan: where.pan, kind: im.b === -1 ? 'table' : im.b === -2 ? 'finger' : 'domino', scale: course.dominoes[im.a].scale, slow, frac: steps ? clamp((im.step - firstStep) / steps, 0, 1) : 0 });
      }
      sim.impacts.length = 0;
      // Placements: a few ticks a frame, softer the faster the build goes;
      // the rest add a little to the rain, like a hand working quickly.
      const pace = 1 / Math.sqrt(Math.max(1, placed.length));
      placed.forEach((i, k) => {
        const d = course.dominoes[i], where = place3(d.x, d.y + 0.02, d.z, cam);
        const amp = (0.16 + Math.random() * 0.08) * where.att * pace;
        if (k < 3) list.push({ amp, pan: where.pan, kind: 'place', scale: 1, slow: 1, frac: placed.length > 1 ? k / placed.length : 0 });
        else rainE += 0.2 * amp * amp;
      });
      placed.length = 0;

      // The loudest get voices, a few a frame and never more than the cap.
      list.sort((a, b) => b.amp - a.amp);
      let free = Math.min(A.perFrame, A.voices - voices.length);
      for (const v of list) {
        if (free > 0 && v.amp > 0.02) { schedule(v, v.frac, dt); free--; }
        else rainE += v.amp * v.amp;
      }
      // The rest become rain: level follows the energy that found no voice.
      const target = clamp(Math.sqrt(rainE / Math.max(dt, 1e-3)) * 0.05, 0, 0.5) * hush;
      rainE = 0;
      const next = rainLevel + (target - rainLevel) * (1 - Math.exp(-dt / 0.12));
      if (Math.abs(next - rainLevel) > 0.002 || (next === 0) !== (rainLevel === 0)) {
        if (rec) rec.push({ t: vt, rain: next });
        if (g) g.rain.gain.setTargetAtTime(next, g.c.currentTime, 0.05);
      }
      rainLevel = next;

      // Room tone follows the show: steady through the build, down for the
      // hush and the push, up with the chain, gone after the last domino,
      // back softly with the sunrise.
      const state = DIRECTOR.state;
      if (state !== mood) {
        mood = state;
        const to = { READY: 0.6, BUILD: 0.8, HUSH: 0.18, PUSH: 0.18, CHAIN: 1, FINALE: 0.8 }[state];
        if (to !== undefined) setRoom(to, state === 'HUSH' ? 0.6 : 1.2);
        if (state === 'REST') restAt = vt;
      }
      const fin = course.lastDomino;   // the very last to fall: silence after it
      if (fin !== undefined && finalAt < 0 && sim.fallT[fin] >= 0) { finalAt = vt; setRoom(0, 0.12); }
      if (restAt >= 0 && vt - restAt > 2.2) { setRoom(0.5, 2); restAt = -1; }
    },

    reset() { finalAt = -1; restAt = -1; doneAt = -1; mood = null; rainLevel = 0; rainE = 0; heard.clear(); },

    // Record what gets played (with or without a live context), then render
    // any stretch of it offline to a 16-bit stereo WAV.
    record(on = true) { rec = on ? [] : null; vt = 0; return on; },
    get recording() { return rec; },
    // Everything before the compressor is linear, so it renders in pieces:
    // the bed in one pass, the impacts in 4 s windows with 1.5 s to ring
    // out, summed, and then compressed and limited as one mix, as live.
    // (One graph holding every voice of the show from the first sample took
    // 25 minutes for two minutes of sound.)
    async render(t0, t1, sr = 44100) {
      const n = Math.ceil((t1 - t0) * sr), L = new Float32Array(n), R = new Float32Array(n);
      const add = (buf, at) => {
        const a = buf.getChannelData(0), b = buf.getChannelData(1);
        for (let i = 0, j = at; i < a.length && j < n; i++, j++) { L[j] += a[i]; R[j] += b[i]; }
      };
      {
        const oc = new OfflineAudioContext(2, n, sr), G = build(oc, 'bed');
        let room = 0, rainAt = 0;
        for (const e of rec) {
          if (e.p) continue;
          if (e.t < t0) { if (e.room !== undefined) room = e.room; if (e.rain !== undefined) rainAt = e.rain; continue; }
          if (e.t > t1) break;
          if (e.rain !== undefined) G.rain.gain.setTargetAtTime(e.rain, e.t - t0, 0.05);
          else if (e.room !== undefined) G.room.gain.setTargetAtTime(e.room, e.t - t0, e.tc);
        }
        G.room.gain.value = room; G.rain.gain.value = rainAt;
        add(await oc.startRendering(), 0);
      }
      const hits = rec.filter((e) => e.p && e.t >= t0 && e.t <= t1).sort((a, b) => a.t - b.t);
      for (let w = t0, k = 0; w < t1 && k < hits.length; w += 4) {
        const at = Math.floor((w - t0) * sr), batch = [];
        while (k < hits.length && hits[k].t < w + 4) batch.push(hits[k++]);
        if (!batch.length) continue;
        const oc = new OfflineAudioContext(2, Math.max(1, Math.min(n - at, Math.ceil(5.5 * sr))), sr), G = build(oc, 'voices');
        for (const e of batch) voice(G, e.p, e.t - w);
        add(await oc.startRendering(), at);
      }
      const oc = new OfflineAudioContext(2, n, sr), D = dynamics(oc), mix = oc.createBuffer(2, n, sr), src = oc.createBufferSource();
      mix.copyToChannel(L, 0); mix.copyToChannel(R, 1);
      src.buffer = mix; src.connect(D.comp); src.start(0);
      const buf = await oc.startRendering();
      L.set(buf.getChannelData(0)); R.set(buf.getChannelData(1));
      const wav = new DataView(new ArrayBuffer(44 + n * 4));
      const str = (o, s) => [...s].forEach((ch, k) => wav.setUint8(o + k, ch.charCodeAt(0)));
      str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt ');
      wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
      wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true);
      str(36, 'data'); wav.setUint32(40, n * 4, true);
      let peak = 0;
      for (let i = 0; i < n; i++) {
        peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
        wav.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
        wav.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
      }
      return { wav: new Uint8Array(wav.buffer), peak, seconds: t1 - t0 };
    },
  };
})();

// --------------------------------------------------------------- BUILDER
// Plays the build schedule on the instanced mesh. The physics is untouched:
// every body already sits settled and asleep in its final pose, and each
// landing ends exactly on that pose, so nothing can be disturbed before the
// push. A placement descends a centimetre or two on a small arc, lands with
// a slight tilt, wobbles out, and now and then gets nudged a few millimetres.
const BUILDER = (() => {
  let plan = null, final = [], next = 0, t = 0, placed = 0, current = 0;
  let state = 'off';   // off | pending | running | done
  const live = [];
  const P = new THREE.Vector3(), Q = new THREE.Quaternion(), R = new THREE.Quaternion(), X = new THREE.Vector3(1, 0, 0);

  function pose(it, tau) {
    const d = course.dominoes[it.i], F = final[it.i], B = CONFIG.build;
    const down = it.dur * 0.55, u = clamp(tau / down, 0, 1);
    const fx = Math.sin(d.yaw), fz = Math.cos(d.yaw), rx = fz, rz = -fx, drop = B.drop * d.scale;
    let lift = 0, back = 0, pitch, side = it.nudge;
    if (tau < down) {
      lift = drop * Math.pow(1 - u, 3);
      back = drop * 0.6 * (1 - u) * (1 - u);
      pitch = lerp(-6, 2.2, u) * DEG;
    } else {
      const v = (tau - down) / (it.dur - down);
      pitch = 2.2 * DEG * Math.exp(-v * 4) * Math.cos(v * Math.PI * 3);
      if (it.nudge) side = it.nudge * (1 - FINGER.ease((v - 0.45) / 0.45));
    }
    P.set(F.p.x - fx * back + rx * side, F.p.y + lift, F.p.z - fz * back + rz * side);
    Q.copy(F.q).multiply(R.setFromAxisAngle(X, pitch));
    RENDER.setPose(it.i, P, Q, d.scale);
  }

  function land(i) { RENDER.setPose(i, final[i].p, final[i].q, course.dominoes[i].scale); placed++; }

  return {
    get state() { return state; },
    get t() { return t; },
    get plan() { return plan; },
    get placed() { return placed; },
    get current() { return current; },

    // Hide everything and plan the build; nothing moves until start().
    prepare() {
      plan = BUILD.schedule(CONFIG, course);
      final = sim.bodies.map((b) => ({ p: new THREE.Vector3().copy(b.translation()), q: new THREE.Quaternion().copy(b.rotation()) }));
      RENDER.hideAll();
      next = 0; t = 0; placed = 0; current = plan.items[0]?.i ?? 0; live.length = 0;
      state = 'pending';
    },
    start() { if (state === 'pending') state = 'running'; },
    clear() { state = 'off'; },

    update(dt) {
      if (state !== 'running') return;
      t += dt;
      const items = plan.items;
      while (next < items.length && items[next].t <= t) { live.push(items[next]); current = items[next].i; next++; }
      for (let k = live.length - 1; k >= 0; k--) {
        const it = live[k], tau = t - it.t;
        if (!it.ticked && tau >= it.dur * 0.55) { it.ticked = true; AUDIO.place(it.i); }
        if (tau >= it.dur) { land(it.i); live.splice(k, 1); }
        else pose(it, tau);
      }
      RENDER.commit();
      if (t >= plan.total && !live.length && next >= items.length) { state = 'done'; RENDER.syncAll(sim); }
    },

    // Put everything in place at once (the lab's skip button, chapter jumps).
    skip() { if (state === 'pending' || state === 'running') { state = 'done'; RENDER.syncAll(sim); } },
  };
})();

// ----------------------------------------------------------------- STORY
// The overlays: a small chapter label, the serif line from the film, and
// the end card. Plain DOM, timed on the director's clock so a scripted run
// and a real one behave the same.
const STORY = (() => {
  const chapter = $('chapter'), line = $('line'), card = $('endcard'), clock = $('clock');
  let chapterUntil = 0, lineUntil = 0, pending = null;

  // A twelve-ray spark for the end card, drawn here rather than copied.
  {
    const rng = makeRng(5), rays = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + rng.signed(0.07), len = 38 + rng.signed(9), w = 5.4;
      const c = Math.cos(a), s = Math.sin(a), px = (-s * w) / 2, py = (c * w) / 2;
      rays.push(`M${px.toFixed(2)} ${py.toFixed(2)}L${(c * len).toFixed(2)} ${(s * len).toFixed(2)}L${(-px).toFixed(2)} ${(-py).toFixed(2)}Z`);
    }
    card.querySelector('.mark').innerHTML = `<path d="${rays.join('')}" fill="#d97757"/>`;
  }
  return {
    chapter(n, title, now) {
      chapter.querySelector('.n').textContent = String(n).padStart(2, '0');
      chapter.querySelector('.t').textContent = title;
      chapter.classList.add('on');
      chapterUntil = now + 3.8;
    },
    // A new phrase fades the old one out first, like the film's cuts.
    line(text, now) {
      if (line.classList.contains('on')) { line.classList.remove('on'); pending = { text, at: now + 0.5 }; }
      else pending = { text, at: now };
    },
    card(on) {
      card.querySelector('.count').textContent = `${course.dominoes.length.toLocaleString('en-GB')} dominoes`;
      card.classList.toggle('on', on);
    },
    // The build's clock: the night passing while the course goes down.
    clock(hours, placed) {
      if (hours === null) { clock.classList.remove('on'); return; }
      const h = Math.floor(hours) % 24, m = Math.floor((hours % 1) * 60);
      clock.querySelector('.n').textContent = `${(h % 12) || 12}:${String(m).padStart(2, '0')}`;
      clock.querySelector('.t').textContent = `${h < 12 ? 'am' : 'pm'} · ${placed.toLocaleString('en-GB')} placed`;
      clock.classList.add('on');
    },
    update(now) {
      if (pending && now >= pending.at) {
        line.textContent = pending.text;
        line.classList.add('on');
        lineUntil = now + 4.2;
        pending = null;
      }
      if (now > chapterUntil) chapter.classList.remove('on');
      if (now > lineUntil) line.classList.remove('on');
    },
    clear() {
      for (const el of [chapter, line, card, clock]) el.classList.remove('on');
      chapterUntil = lineUntil = 0;
      pending = null;
    },
  };
})();

// -------------------------------------------------------------- DIRECTOR
// READY -> BUILD -> HUSH -> PUSH -> CHAIN -> FINALE -> REST. The build is a
// time-lapse montage with hard cuts: close on the first placements, a wide
// shot per chapter, the whole course at first light, then the last safety
// gaps in close-up. The camera trails the wavefront
// on a spring along the course centre line. In the show each story section
// names its shot; connectors get the low follow, and the isolation tests
// pick a shot by section type. Shot changes blend between two live shots by
// orbiting the look point. Entering a story section also cues the sky, the
// chapter label, the serif line and any slow-motion beat.
const DIRECTOR = (() => {
  const camera = RENDER.camera;
  const pose = () => ({ pos: new THREE.Vector3(), look: new THREE.Vector3(), fov: 30 });
  const live = pose(), from = pose(), cur = pose(), tmp = pose();
  const focus = new THREE.Vector3();
  let blend = 1, blendDur = 1.5;
  let state = 'READY', stateT = 0, clock = 0;
  let sCam = 0, vCam = 0, sWave = 0, vWave = 0, seen = -1, seenT = 0, hCam = 0;
  let shot = null, shotSec = null, zoom = 1, zoomV = 0, shotT = 0;
  let waveSec = null, armed = [], allDownAt = -1, onRest = null;
  let buildShot = null, buildShotT = 0, sBuild = 0, vBuild = 0;
  const PACE = () => CONFIG.show.pace ?? 1;
  let ts = 1, tsTarget = 1, tsUntil = 0, tsHoldSec = null;

  const SHOT = { fork: 'high', spiral: 'overhead', field: 'overhead', curtain: 'overhead', ramp: 'heroic' };
  const storied = () => course.sections.some((s) => s.story);
  const hand = () => (storied() ? CONFIG.cameraSide ?? 1 : 1);
  const turn = (a) => Math.atan2(Math.sin(a), Math.cos(a));

  // Macro follow: beside and ahead of the path point, looking back at it,
  // oriented by the smoothed path heading so S-bends do not whip it around.
  function along(s, side, ahead, height, lookY, lookAhead = 0, out = live, h = hCam) {
    const p = pathPoint(s), l = lookAhead ? pathPoint(s + lookAhead) : p;
    const fx = Math.sin(h), fz = Math.cos(h), rx = fz * hand(), rz = -fx * hand();
    out.look.set(l.x, lookY, l.z);
    out.pos.set(p.x + rx * side + fx * ahead, height, p.z + rz * side + fz * ahead);
    focus.set(p.x, 0, p.z);
  }

  // Straight down on a patch of table, from slightly behind so the wave runs
  // up the screen (the same side the high shot looks from).
  // On a sphere round a patch of table: elevation and compass offset (from
  // the patch's heading) in degrees and radians. Fits the patch's radius.
  function orbit(b, out, fov, el, az) {
    const h = (b.h ?? 0) + az, d = b.r / Math.sin((fitFov(fov) / 2) * DEG) * 0.95, e = el * DEG;
    out.pos.set(b.x - Math.sin(h) * d * Math.cos(e), d * Math.sin(e), b.z - Math.cos(h) * d * Math.cos(e));
    out.look.set(b.x, 0, b.z);
    out.fov = fov;
    focus.set(b.x, 0, b.z);
    return b.r * 1.1;
  }

  // A hard cut: no blend from wherever the camera was.
  function snap() {
    cur.pos.copy(live.pos); cur.look.copy(live.look); cur.fov = live.fov;
    from.pos.copy(live.pos); from.look.copy(live.look); from.fov = live.fov;
    blend = 1;
    lensSnap = true;
    OP.live = false;   // a cut: the operator jumps with it
    if (layers.length) { layers = layers.slice(-1); layers[0].p = 1; }
  }

  // Clearance. Low shots ride at domino-top height beside the line, and a
  // tight turn, a fork or a blend from one side of the line to the other
  // can bring a domino right up to the lens (in turn-3 one filled the
  // frame). Within `reach` of a domino (plan view) the camera lifts to clear
  // its current top, rising fast and settling slowly. The aim stays put, so
  // the camera tilts down over the obstacle instead.
  const CLEAR = { cell: 0.1, reach: 0.09, close: 0.03, margin: 0.015 };
  let grid = null, gridCourse = null, lift = 0;
  function clearance(p) {
    if (p.y > 0.3) return 0;
    if (gridCourse !== course) {
      grid = new Map(); gridCourse = course;
      for (const d of course.dominoes) {
        const k = `${Math.floor(d.x / CLEAR.cell)},${Math.floor(d.z / CLEAR.cell)}`;
        (grid.get(k) ?? grid.set(k, []).get(k)).push(d.index);
      }
    }
    const D = CONFIG.domino, cx = Math.floor(p.x / CLEAR.cell), cz = Math.floor(p.z / CLEAR.cell);
    let need = 0;
    for (let i = cx - 1; i <= cx + 1; i++) for (let j = cz - 1; j <= cz + 1; j++) {
      for (const k of grid.get(`${i},${j}`) ?? []) {
        const s = course.dominoes[k].scale;
        if (s > 2) continue;   // the giant's shots are framed round it
        const b = sim.bodies[k], t = b.translation(), a = QUAT.axes(b.rotation());
        const top = t.y + 0.5 * s * (Math.abs(a[0][1]) * D.w + Math.abs(a[1][1]) * D.h + Math.abs(a[2][1]) * D.t);
        const d = Math.hypot(t.x - p.x, t.z - p.z) - 0.5 * s * D.w;
        const w = 1 - smooth((d - CLEAR.close) / (CLEAR.reach - CLEAR.close));
        if (w > 0) need = Math.max(need, (top + CLEAR.margin - p.y) * w);
      }
    }
    return need;
  }

  // Depth of field. Focus rides a fast spring onto a subject: the domino
  // going over right now once the chain runs, the first domino for the
  // push, the hand's domino in the build close-ups, and the look point
  // otherwise. Hard cuts snap it. The aperture eases between values
  // authored per moment and per shot (CONFIG.look.dof.aperture).
  const subject = new THREE.Vector3(), _fw = new THREE.Vector3();
  let fDepth = 0.3, fVel = 0, fAp = 0.012, lensSnap = true;
  const dominoAt = (i) => { const t = sim.bodies[i].translation(); subject.set(t.x, t.y, t.z); };
  function lens(dt) {
    const L = CONFIG.look?.dof;
    if (!L) return;
    const AP = L.aperture;
    let ap = AP[state] ?? AP.READY;
    subject.copy(debug ? controls.target : cur.look);
    if (debug) ap = L.lab;
    else if (state === 'BUILD') {
      const k = buildShot?.kind;
      if (k === 'wide' || k === 'whole') ap = AP.wide;
      else if (k === 'macro') dominoAt(BUILDER.current);
      else if (buildShot) dominoAt(buildShot.index);
    } else if (state === 'PUSH') dominoAt(0);
    else if (state === 'CHAIN' || state === 'FINALE') {
      // The giant throws debris that topples far down the table and would
      // pull focus metres away: the wavefront only counts near the shot.
      dominoAt(Math.max(0, sim.lastFall));
      if (subject.distanceTo(cur.look) > Math.max(0.15, 0.6 * cur.pos.distanceTo(cur.look))) subject.copy(cur.look);
      ap = AP[shot] ?? AP.low;
    }
    else if (state === 'REST') ap = AP[shot] ?? AP.REST;
    camera.getWorldDirection(_fw);
    const target = Math.max(0.02, _fw.dot(subject.sub(camera.position)));
    if (lensSnap) { fDepth = target; fVel = 0; fAp = ap; lensSnap = false; }
    else {
      const w = L.follow, h = Math.min(dt, 0.05);
      fVel += (w * w * (target - fDepth) - 2 * w * fVel) * h;
      fDepth += fVel * h;
      fAp += (ap - fAp) * (1 - Math.exp(-dt / 0.5));
    }
    RENDER.lens.focus = fDepth;
    RENDER.lens.aperture = fAp;
  }

  // The push: a fingertip if configured, otherwise an impulse.
  function strike() {
    if (CONFIG.push.finger) { sim.fingerStart(0); go('PUSH', 1.0); }
    else { sim.push(); go('CHAIN', 1.2); }
  }

  function frame(b, out, fov = 34, lean = 0.08) {
    const f = [Math.sin(b.h), Math.cos(b.h)];
    const H = (b.r / Math.tan((fitFov(fov) / 2) * DEG)) * 1.08;
    out.pos.set(b.x - f[0] * H * lean, H, b.z - f[1] * H * lean);
    out.look.set(b.x, 0, b.z);
    out.fov = fov;
    focus.set(b.x, 0, b.z);
    return b.r * 1.1;
  }
  function union(ids) {
    const secs = course.sections.filter((s) => ids.includes(s.id));
    const x0 = Math.min(...secs.map((s) => s.ext.x0)), x1 = Math.max(...secs.map((s) => s.ext.x1));
    const z0 = Math.min(...secs.map((s) => s.ext.z0)), z1 = Math.max(...secs.map((s) => s.ext.z1));

      if (seen >= 0 && sim.t > seenT) {
        const inst = Math.max(0, (s - sWave) / (sim.t - seenT));
        vWave += (inst - vWave) * 0.25;
      }
      seen = sim.lastFall; seenT = sim.t; sWave = Math.max(sWave, s);
      const sec = front();
      if (sec !== waveSec) enter(sec);
    } else if (seen >= 0 && sim.t - seenT > 0.12) {
      vWave *= Math.exp(-4 * sdt);   // the wave stopped; stop leading it
    }

    // Slow-motion beats: armed ones fire when their domino goes down.
    for (const a of armed) if (!a.done && sim.fallT[a.index] >= 0) { a.done = true; slow(a.scale, a.hold); }
    // A section's slow motion ends when the wave leaves it, or when every
    // domino in it is down (the last field has nowhere to leave to).
    if (tsHoldSec ? waveSec !== tsHoldSec || sectionDown(tsHoldSec) : clock > tsUntil) { tsTarget = PACE(); tsHoldSec = null; }
    ts += (tsTarget - ts) * (1 - Math.exp(-(tsTarget < ts ? 7 : 2.2) * dt));

    STORY.update(clock);
    RENDER.stepSky(dt);

    // The camera's path position chases the wave on a critically damped
    // spring, fed forward by the wave speed (it lags 2v/w otherwise), and
    // assumes the wave is already moving once the first domino is down.
    if (state === 'CHAIN' || state === 'FINALE') {
      const w = 7, v = seen >= 0 ? Math.max(vWave, 0.7) : vWave;
      const target = Math.min(sWave + v * (2 / w) * 0.9, course.path[course.path.length - 1].s - 0.12);
      vCam += (w * w * (target - sCam) - 2 * w * vCam) * sdt;
      sCam += vCam * sdt;
    }
    hCam += turn(pathPoint(sCam).h - hCam) * (1 - Math.exp(-2.2 * dt));

    // The heroic shot's scale: the size of the next domino to go, on a
    // critically damped spring, so the pull-back never starts or stops dead
    // (a plain lag jumped in speed when the giant fell and the next domino
    // was suddenly a twentieth of its size).
    if (sim.lastFall >= 0) {
      const next = course.dominoes[Math.min(sim.n - 1, sim.lastFall + 1)], kz = 2.2;
      zoomV += (kz * kz * (next.scale - zoom) - 2 * kz * zoomV) * sdt;
      zoom += zoomV * sdt;
    }

    let shadowHalf = 0.34;
    const story = storied();
    switch (state) {
      case 'READY':
        if (story) { along(0.08 + Math.sin(clock * 0.2) * 0.02, 0.16, 0.34, 0.03, 0.036, 0.08); live.fov = 24; }
        else { along(0.05 + Math.sin(clock * 0.25) * 0.015, 0.14, 0.21, 0.045, 0.02); live.fov = 30; }
        shadowHalf = 0.45;
        break;
      case 'BUILD': {
        BUILDER.update(dt);
        const plan = BUILDER.plan, bt = BUILDER.t;
        let sh = plan.shots[0];
        for (const x of plan.shots) if (x.t <= bt) sh = x;
        const cut = sh !== buildShot;
        if (cut) { buildShot = sh; buildShotT = bt; if (sh.kind === 'whole') RENDER.setSky('dawn'); }
        const since = bt - buildShotT;
        if (sh.kind === 'macro') {
          // Close on the hand's work, drifting along as the line grows.
          const s = course.dominoes[BUILDER.current].s;
          if (cut) { sBuild = s; vBuild = 0; }
          vBuild += (9 * (s - sBuild) - 6 * vBuild) * dt;
          sBuild += vBuild * dt;
          along(sBuild + 0.02, 0.1, 0.17, 0.034, 0.02, 0.03, live, pathPoint(sBuild).h);
          live.fov = 28;
          shadowHalf = 0.3;
        } else if (sh.kind === 'wide') {
          shadowHalf = orbit(course.chapters[sh.chapter], live, 36, 34, (sh.chapter % 2 ? 0.5 : -0.5) + since * 0.06);
        } else if (sh.kind === 'whole') {
          shadowHalf = orbit(course.bounds, live, 36, 50, 0.25 + since * 0.04);
        } else {
          const d = course.dominoes[sh.index];
          along(d.s, 0.1, 0.16, 0.036, 0.022, 0.01, live, d.heading);
          live.fov = 26;
          shadowHalf = 0.3;
        }
        if (cut) snap();
        STORY.clock(BUILD.hour(CONFIG, plan, bt), BUILDER.placed);
        if (BUILDER.state === 'done') { STORY.clock(null); go('HUSH', 1.4); }
        break;
      }
      case 'HUSH': {
        // A slow, low dolly back along the opening line to the first domino.
        const k = smooth(stateT / CONFIG.show.hush);
        if (story) { along(lerp(0.34, 0.02, k), 0.16, 0.34, lerp(0.022, 0.03, k), 0.036, 0.08); live.fov = 24; }
        else { along(lerp(0.26, 0.02, k), lerp(0.12, 0.14, k), lerp(0.15, 0.2, k), lerp(0.03, 0.048, k), 0.02); live.fov = 30; }
        shadowHalf = 0.45;
        if (stateT >= CONFIG.show.hush) strike();
        break;
      }
      case 'PUSH': {
        // Side on to the first domino, a little behind it and on the side
        // the sun is on, so the finger comes in lit from the edge of frame
        // and the domino tips away.
        const d = course.dominoes[0], f = [Math.sin(d.yaw), Math.cos(d.yaw)];
        const sun = RENDER.keyDir, side = Math.sign(sun.x * f[1] - sun.z * f[0]) || 1, r = [f[1] * side, -f[0] * side];
        live.look.set(d.x + f[0] * 0.01, 0.03, d.z + f[1] * 0.01);
        live.pos.set(d.x + r[0] * 0.16 - f[0] * 0.05, 0.052, d.z + r[1] * 0.16 - f[1] * 0.05);
        live.fov = 26;
        focus.set(d.x, 0, d.z);
        shadowHalf = 0.3;
        if (sim.fallT[0] >= 0) go('CHAIN', 0.8, true);
        break;
      }
      case 'CHAIN':
      case 'FINALE': {
        const sec = front();
        cue(sec.story?.shot ?? (story ? 'low' : SHOT[sec.type] ?? 'low'), sec);
        const all = sim.fallen === sim.nChain, idle = sim.t - sim.lastFallT;
        if (all && allDownAt < 0) allDownAt = clock;
        if ((all && clock - allDownAt > (story ? 1.6 : 0.7)) || (sim.fallen > 0 && idle > 2.5) || (sim.fallen === 0 && stateT > 4)) {
          go('REST', 2.6);
          if (story) RENDER.setSky('sunrise');
          onRest?.();
        }
        break;
      }
      case 'REST':
        if (story) {
          // Sunrise: a cut to Sonnet 5, along the names left to right, and up
          // to the message, where the card comes in.
          if (shot !== 'tour') { cue('tour', null, 0.001); snap(); }
          if (stateT > 11.5) STORY.card(true);
        } else {
          const end = course.sections[course.sections.length - 1];
          cue(SHOT[end.type] === 'overhead' ? 'overhead' : 'aftermath', end, 2);
        }
        break;
    }

    if (shot) {
      shadowHalf = shoot(dt, sdt);
      if (state === 'CHAIN') {
        // Very low amplitude handheld drift, during the chain only.
        live.pos.x += (Math.sin(clock * 1.7) + Math.sin(clock * 3.1 + 1.3) * 0.5) * 0.0005;
        live.pos.y += (Math.sin(clock * 2.3 + 0.7) + Math.sin(clock * 4.3) * 0.4) * 0.0004;
        live.look.x += Math.sin(clock * 1.1 + 2.1) * 0.0004;
      }
    }

    blend = Math.min(1, blend + dt / blendDur);
    if (carry && blend < 1) {
      const p = pathPoint(sCam), dx = p.x - carry.x, dz = p.z - carry.z;
      from.pos.x += dx; from.pos.z += dz; from.look.x += dx; from.look.z += dz;
      carry = p;
    }
    blendPose(from, live, smooth(blend), cur, stateWay);
    if (state === 'CHAIN' || state === 'FINALE') keepInFrame(cur);
    const need = debug ? 0 : clearance(cur.pos);
    lift += (need - lift) * (1 - Math.exp(-(need > lift ? 20 : 1.5) * dt));
    apply(dt);
    lens(dt);
    if (debug) RENDER.setShadowFrame(controls.target, clamp(camera.position.distanceTo(controls.target) * 0.45, 0.2, 1.6));
    else RENDER.setShadowFrame(focus, shadowHalf);
  }

  // Leaving the orbit camera: blend from wherever it was left.
  function takeOver() {
    from.pos.copy(camera.position); from.look.copy(controls.target); from.fov = cur.fov;
    cur.pos.copy(from.pos); cur.look.copy(from.look); cur.fov = from.fov;
    blend = 0; blendDur = 1.5;
    OP.live = false;
  }

  // Lab only: start the chain at a chapter. The push goes in five dominoes
  // early so the wave arrives with its usual momentum: a single pushed
  // domino only leans on the wall's loaded first domino and stops.
  // Everything before the run-up stays standing.
  function jumpTo(n) {
    const sec = course.sections.find((s) => s.story?.chapter === n);
    if (!sec) return false;
    let entry = sec.first;
    while (course.dominoes[entry].role !== 'chain') entry++;
    // Never back into a field: its rows are too close for a pushed domino to
    // tip (the phase 1 push failure). Alternate parents so a run-up through
    // any other multi-parent piece walks straight back.
    for (let k = 0; k < 5 && course.dominoes[entry].parents.length; k++) {
      const ps = course.dominoes[entry].parents, next = ps[k % ps.length];
      if (course.sectionOf[next].type === 'field') break;
      entry = next;
    }
    reset();
    RENDER.setSky(sec.story.sky ?? 'day', true);
    sCam = sWave = course.dominoes[entry].s;
    frontIdx = course.sections.indexOf(course.sectionOf[entry]);
    hCam = pathPoint(sCam).h;
    sim.push(entry);
    state = 'CHAIN'; stateT = 0;
    enter(sec);
    update(0, 0);
    cur.pos.copy(live.pos); cur.look.copy(live.look); cur.fov = live.fov;
    blend = 1;
    OP.live = false;
    apply();
    lensSnap = true; lens(0);
    return true;
  }

  return {
    get timeScale() { return ts; },
    get debug() { return { shot, layers: layers.map((L) => `${L.kind}:${L.p.toFixed(2)}`).join(' '), blend: +blend.toFixed(2), sCam: +sCam.toFixed(3), sWave: +sWave.toFixed(3), hCam: +(hCam / DEG).toFixed(1), lift: +lift.toFixed(3), zoom: +zoom.toFixed(2), target: [cur.pos.x, cur.pos.y, cur.pos.z].map((v) => +v.toFixed(4)), aim: [cur.look.x, cur.look.y, cur.look.z].map((v) => +v.toFixed(4)), live: [live.pos.x, live.pos.y, live.pos.z].map((v) => +v.toFixed(4)) }; },
    get state() { return state; },
    get wave() { return { s: sWave, v: vWave }; },
    get look() { return cur.look; },
    get section() { return waveSec; },
    set onRest(f) { onRest = f; },
    reset, update, takeOver, jumpTo,
    start() {
      if (state !== 'READY') return;
      if (BUILDER.state === 'pending') { BUILDER.start(); state = 'BUILD'; stateT = 0; RENDER.setSky('lamp', true); }
      else go('HUSH', 1.0);
    },
    // Finish the build at once (lab, jumps) and carry on to the hush.
    skipBuild() {
      BUILDER.skip();
      if (state === 'BUILD') { STORY.clock(null); RENDER.setSky('dawn'); go('HUSH', 1.2); }
    },
    pushNow() {
      if (state === 'BUILD') this.skipBuild();
      if (state === 'READY' || state === 'HUSH') { BUILDER.skip(); strike(); }
    },
  };
})();
